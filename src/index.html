<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
  <section">
  <img src="/background (1).png" class="absolute w-1400 h-180">
  <div class=""></div>

  <div class="relative max-w-7xl mx-auto px-8 py-8 flex items-center justify-between">
    <span class="text-white text-xl font-bold">Physionic</span>
    <div class="flex gap-8 text-sm text-white">
      <span>Home</span>
      <span>Product</span>
      <span>Pricing</span>
      <span>Contact</span>
    </div>
    <button class="bg-sky-500 text-white text-sm px-6 py-3 rounded-lg flex items-center gap-2">
      Get Quote Now <span>→</span>
    </button>
  </div>

  <div class="relative max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-10 items-center pb-20">
    <div class="pt-10">
      <h1 class="text-5xl font-bold text-white leading-tight mb-6">
        Meet the Best Hospital
      </h1>
      <p class="text-gray-200 mb-8">
        We know how large objects will act,<br>but things on a small scale.
      </p>
      <div class="flex gap-4">
        <button class="bg-sky-500 text-white px-6 py-3 rounded-full text-sm">
          Get Quote Now
        </button>
        <button class="border border-white text-white px-6 py-3 rounded-full text-sm">
          Learn More
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-8 w-80 ml-50">
      <h2 class="text-xl font-bold text-gray-900 mb-6">Book Appointment</h2>
      <label class="block text-sm text-gray-700 mb-2">Name *</label>
      <input type="text" placeholder="Full Name *" class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm mb-5 outline-none">
      <label class="block text-sm text-gray-700 mb-2">Email address *</label>
      <input type="email" placeholder="example@gmail.com" class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm mb-5 outline-none">
      <label class="block text-sm text-gray-700 mb-2">Departement *</label>
      <select class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm mb-5 outline-none text-gray-400">
        <option>Please Select</option>
      </select>
      <label class="block text-sm text-gray-700 mb-2">Time *</label>
      <select class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm mb-6 outline-none text-gray-400">
        <option>4:00 Available</option>
      </select>

      <button class="w-full bg-sky-500 text-white py-3 rounded-lg text-sm font-medium">
        Book Appointment
      </button>
    </div>
  </div>
</section>


</body>
</html>
